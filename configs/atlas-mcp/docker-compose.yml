services:
  qdrant:
    image: qdrant/qdrant:latest
    container_name: qdrant
    restart: unless-stopped
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - /mnt/mcp-data/qdrant:/qdrant/storage
    environment:
      - QDRANT__STORAGE__DISABLE_WAL_CHECKSUM=true
    networks:
      - atlas-mcp

  # mcp-proxmox: image broken (missing urllib3) — re-enable once fixed
  # mcp-fetch: @modelcontextprotocol/server-fetch doesn't exist on npm — needs research
  # mcp-filesystem: working (stdio mode) — re-enable with HTTP bridge when ready

networks:
  atlas-mcp:
    driver: bridge
