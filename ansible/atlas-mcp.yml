---
- name: Create atlas-mcp LXC container
  hosts: proxmox_hosts
  gather_facts: false

  vars:
    vmid: 301
    hostname: atlas-mcp
    ip: "192.168.0.30/24"
    gw: "192.168.0.1"
    storage: "vm_storage01"
    template: "local:vztmpl/debian-12-standard_12.12-1_amd64.tar.zst"
    cores: 2
    memory: 2048
    disk: "20"
    proxmox_token_user: "root@pam"
    proxmox_token_id: "ansible"

  tasks:
    - name: Create LXC container
      community.general.proxmox:
        vmid: "{{ vmid }}"
        api_host: localhost
        api_user: "{{ proxmox_token_user }}"
        api_token_id: "{{ proxmox_token_id }}"
        api_token_secret: "{{ proxmox_token_secret }}"
        node: atlas01
        hostname: "{{ hostname }}"
        ostemplate: "{{ template }}"
        storage: "{{ storage }}"
        cores: "{{ cores }}"
        memory: "{{ memory }}"
        disk: "{{ storage }}:{{ disk }}"
        netif:
          net0: "name=eth0,bridge=vmbr0,ip={{ ip }},gw={{ gw }}"
        features:
          - nesting=1
        unprivileged: true
        state: present

    - name: Start container
      community.general.proxmox:
        vmid: "{{ vmid }}"
        api_host: localhost
        api_user: "{{ proxmox_token_user }}"
        api_token_id: "{{ proxmox_token_id }}"
        api_token_secret: "{{ proxmox_token_secret }}"
        node: atlas01
        state: started

    - name: Wait for container to boot
      pause:
        seconds: 15

    - name: Create NFS mount points on atlas01 host
      file:
        path: "{{ item }}"
        state: directory
      loop:
        - /mnt/pve/mcp-data
        - /mnt/bot-data

    - name: Mount NFS shares on atlas01 host
      mount:
        path: "{{ item.path }}"
        src: "{{ item.src }}"
        fstype: nfs
        opts: "defaults,_netdev"
        state: mounted
      loop:
        - { path: /mnt/pve/mcp-data, src: "192.168.0.12:/mnt/Atlaspool/mcp-data" }
        - { path: /mnt/bot-data, src: "192.168.0.12:/mnt/Atlaspool/bot-data" }

    - name: Bind-mount NFS paths into container
      shell: "pct set {{ vmid }} --mp{{ item.id }} {{ item.host_path }},mp={{ item.ct_path }}{{ item.extra }}"
      loop:
        - { id: 0, host_path: /mnt/pve/mcp-data/qdrant, ct_path: /mnt/mcp-data/qdrant, extra: "" }
        - { id: 1, host_path: /mnt/bot-data, ct_path: /mnt/bot-data, extra: ",ro=1" }

- name: Configure atlas-mcp container
  hosts: atlas_mcp
  gather_facts: false

  tasks:
    - name: Install dependencies
      apt:
        name:
          - docker.io
          - docker-compose
          - nfs-common
        state: present
        update_cache: true

    - name: Enable and start Docker
      systemd:
        name: docker
        enabled: true
        state: started

    - name: Create app directory
      file:
        path: /opt/atlas-mcp
        state: directory
        mode: "0755"

    - name: Copy docker-compose.yml
      copy:
        src: ../configs/atlas-mcp/docker-compose.yml
        dest: /opt/atlas-mcp/docker-compose.yml
        mode: "0644"

    - name: Copy .env (fill secrets before running playbook)
      copy:
        src: ../configs/atlas-mcp/.env
        dest: /opt/atlas-mcp/.env
        mode: "0600"

    - name: Create systemd service
      copy:
        dest: /etc/systemd/system/atlas-mcp.service
        content: |
          [Unit]
          Description=Atlas MCP Services
          Requires=docker.service
          After=docker.service network-online.target
          Wants=network-online.target

          [Service]
          Type=oneshot
          RemainAfterExit=yes
          WorkingDirectory=/opt/atlas-mcp
          ExecStart=/usr/bin/docker-compose up -d
          ExecStop=/usr/bin/docker-compose down
          TimeoutStartSec=120

          [Install]
          WantedBy=multi-user.target
        mode: "0644"

    - name: Enable and start atlas-mcp service
      systemd:
        name: atlas-mcp
        daemon_reload: true
        enabled: true
        state: started
