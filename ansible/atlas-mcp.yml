---
- name: Create atlas-mcp LXC container
  hosts: proxmox_hosts
  gather_facts: false

  vars:
    vmid: 301
    hostname: atlas-mcp
    ip: "192.168.0.30/24"
    gw: "192.168.0.1"
    storage: "vg_atlas01_ssd-thinpool"
    template: "local:vztmpl/debian-12-standard_12.7-1_amd64.tar.zst"
    cores: 2
    memory: 2048
    disk: "20"

  tasks:
    - name: Create LXC container
      community.general.proxmox:
        vmid: "{{ vmid }}"
        api_host: localhost
        api_user: root@pam
        api_token_id: atlas-mcp-ro
        api_token_secret: "{{ proxmox_token_secret }}"
        node: atlas01
        hostname: "{{ hostname }}"
        ostemplate: "{{ template }}"
        storage: "{{ storage }}"
        cores: "{{ cores }}"
        memory: "{{ memory }}"
        disk: "{{ disk }}G"
        netif:
          net0: "name=eth0,bridge=vmbr0,ip={{ ip }},gw={{ gw }}"
        features:
          - nesting=1
        unprivileged: true
        state: present

    - name: Start container
      community.general.proxmox:
        vmid: "{{ vmid }}"
        api_host: localhost
        api_user: root@pam
        api_token_id: atlas-mcp-ro
        api_token_secret: "{{ proxmox_token_secret }}"
        node: atlas01
        state: started

    - name: Wait for container to boot
      pause:
        seconds: 15

    - name: Add qdrant NFS mount point
      shell: >
        pct set {{ vmid }}
        --mp0 192.168.0.12:/mnt/Atlaspool/mcp-data/qdrant,mp=/mnt/mcp-data/qdrant,shared=1
      ignore_errors: true

    - name: Add bot-data NFS mount point
      shell: >
        pct set {{ vmid }}
        --mp1 192.168.0.12:/mnt/Atlaspool/bot-data,mp=/mnt/bot-data,shared=1,ro=1
      ignore_errors: true

- name: Configure atlas-mcp container
  hosts: atlas_mcp
  gather_facts: false

  tasks:
    - name: Install dependencies
      apt:
        name:
          - docker.io
          - docker-compose-v2
          - nfs-common
        state: present
        update_cache: true

    - name: Enable and start Docker
      systemd:
        name: docker
        enabled: true
        state: started

    - name: Create app directory
      file:
        path: /opt/atlas-mcp
        state: directory
        mode: "0755"

    - name: Copy docker-compose.yml
      copy:
        src: ../configs/docker-compose.yml
        dest: /opt/atlas-mcp/docker-compose.yml
        mode: "0644"

    - name: Copy .env (fill secrets before running playbook)
      copy:
        src: ../configs/.env
        dest: /opt/atlas-mcp/.env
        mode: "0600"

    - name: Create systemd service
      copy:
        dest: /etc/systemd/system/atlas-mcp.service
        content: |
          [Unit]
          Description=Atlas MCP Services
          Requires=docker.service
          After=docker.service network-online.target
          Wants=network-online.target

          [Service]
          Type=oneshot
          RemainAfterExit=yes
          WorkingDirectory=/opt/atlas-mcp
          ExecStart=/usr/bin/docker compose up -d
          ExecStop=/usr/bin/docker compose down
          TimeoutStartSec=120

          [Install]
          WantedBy=multi-user.target
        mode: "0644"

    - name: Enable and start atlas-mcp service
      systemd:
        name: atlas-mcp
        daemon_reload: true
        enabled: true
        state: started
