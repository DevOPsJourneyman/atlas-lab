---
- name: Deploy Atlas Memory MCP Brain
  hosts: atlas_mcp
  become: yes

  vars:
    app_dir: /opt/mcp-memory
    service_name: mcp-brain

  tasks:
    - name: Create app directory
      file:
        path: "{{ app_dir }}"
        state: directory
        mode: "0755"

    - name: Copy MCP brain application files
      copy:
        src: "mcp-brain/{{ item }}"
        dest: "{{ app_dir }}/{{ item }}"
        mode: "0644"
      loop:
        - index.js
        - package.json

    - name: Install Node.js dependencies
      npm:
        path: "{{ app_dir }}"
        state: present

    - name: Copy systemd service file
      copy:
        src: mcp-brain.service
        dest: "/etc/systemd/system/{{ service_name }}.service"
        mode: "0644"

    - name: Enable and start MCP brain service
      systemd:
        name: "{{ service_name }}"
        daemon_reload: true
        enabled: true
        state: restarted

    - name: Wait for brain to come online
      wait_for:
        port: 3000
        delay: 3
        timeout: 30

    - name: Verify health endpoint
      uri:
        url: "http://localhost:3000/health"
        return_content: yes
      register: health_check

    - name: Show health status
      debug:
        msg: "Brain status: {{ health_check.content }}"
